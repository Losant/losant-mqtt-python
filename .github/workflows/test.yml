name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  test:
    strategy:
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
    - name: Cancel Previous Runs
      # tag 0.13.1
      uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66
      with:
        access_token: ${{ github.token }}
    # tag v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install uv
      # tag v10.3.3
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - run: uv sync --locked
    - name: Run tests
      run: uv run python -m unittest discover -s tests -p "*_tests.py"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # tag v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install uv
      # tag v10.3.3
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - run: uv build
    - name: Verify wheel contents
      run: unzip -l dist/*.whl | grep losantmqtt/RootCA.crt
    - name: Smoke test wheel install
      run: |
        uv venv /tmp/smoke
        uv pip install --python /tmp/smoke/bin/python dist/*.whl
        cd /tmp && /tmp/smoke/bin/python -c "from losantmqtt import Device; import os; from losantmqtt.device import ROOT_CA_PATH; assert os.path.exists(ROOT_CA_PATH)"
